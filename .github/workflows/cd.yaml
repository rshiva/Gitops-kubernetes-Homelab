name: Push to ECR and Deploy to EKS
on:
  pull_request:
    branches:
      - main
    types: [closed]

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.value}}

    steps:
      - name: checkout
        uses: actions/checkout@v4
      - run: echo "The PR was successfully merged!"

      - name: set image tag
        id: set-tag
        run: echo "value=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: configure AWS credentials OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN}}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: build, tag, push docker image to amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPO_NAME}}
          IMAGE_TAG: ${{github.sha}}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./app
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # kustomize is not pre-installed on ubuntu-latest; install it explicitly
      # so `kustomize edit set image` is available in the deploy step
      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Deploy to Dev
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # aws eks update-kubeconfig \
          #   --region ap-south-1 \
          #   --name devopsrt-homelab-dev-eks-cluster

          cd k8s/overlays/dev


          kustomize edit set image \
            python-dynamo-lab-app-image=640565834670.dkr.ecr.ap-south-1.amazonaws.com/devopsrt-homelab-dev:$IMAGE_TAG

          git config user.email "ci@github.com"
          git config user.name "Github Actions"
          git add  kustomization.yaml
          git commit -m "ci: update image tag to $IMAGE_TAG"
          git push

          # kubectl apply -k .

          # # Deployment name matches base (python-dynamo-lab-app); namePrefix was removed from the overlay.
          # # Namespace matches overlays/dev/kustomization.yaml namespace field.
          # kubectl rollout status deployment/python-dynamo-lab-app \
          #   -n python-dynamo-lab \
          #   --timeout=180s
